# This addon file adds rate limiting configuration to Envoy Gateway, backed by
# Valkey instead of Redis. Valkey speaks the Redis protocol that the external
# rate limit service uses, so the backend type stays "Redis"; Valkey is not a
# separate Envoy Gateway backend type.
#
# Use this in combination with the base envoy-gateway-values.yaml:
#
#   helm upgrade -i eg oci://docker.io/envoyproxy/gateway-helm \
#     --version v0.0.0-latest \
#     --namespace envoy-gateway-system \
#     --create-namespace \
#     -f ../../manifests/envoy-gateway-values.yaml \
#     -f envoy-gateway-values-valkey-addon.yaml
#
# Prerequisites:
# - Valkey must be deployed (see valkey.yaml in this directory)
#
# This is the Valkey counterpart of envoy-gateway-values-addon.yaml. Apart from
# the backend URL the two files are identical, so keep the rate limit image pin
# below in sync with the one there.

config:
  envoyGateway:
    provider:
      kubernetes:
        rateLimitDeployment:
          patch:
            type: StrategicMerge
            value:
              spec:
                template:
                  spec:
                    containers:
                      - imagePullPolicy: IfNotPresent
                        name: envoy-ratelimit
                        image: docker.io/envoyproxy/ratelimit:60d8e81b
    rateLimit:
      backend:
        type: Redis
        redis:
          # Update this URL to match your Valkey service location
          # This assumes Valkey is deployed using the valkey.yaml in this directory
          url: valkey.valkey-system.svc.cluster.local:6379
